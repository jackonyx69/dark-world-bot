openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Dark Would Expose API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: admin
  - name: posts
  - name: categories
  - name: packages
  - name: payments
  - name: users
  - name: video-call
  - name: social-links
  - name: settings
  - name: gallery

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

