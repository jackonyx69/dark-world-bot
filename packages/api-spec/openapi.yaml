              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferralSetting"
    post:
      operationId: createReferralSetting
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralSettingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSetting"

  /admin/referral-settings/{id}:
    delete:
      operationId: deleteReferralSetting
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── User facing public posts ─────────────────────────────────
  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      parameters:
        - name: section
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /posts/{slug}:
    get:
      operationId: getPost
      tags: [posts]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post detail with blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetail"
