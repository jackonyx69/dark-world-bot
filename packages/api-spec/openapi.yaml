  /referral-settings:
    get:
      operationId: listPublicReferralSettings
      tags: [users]
      responses:
        "200":
          description: Public referral reward tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferralSetting"

  # ─── Settings ─────────────────────────────────────────────────
  /admin/settings:
    get:
      operationId: getSettings
      tags: [admin]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: updateSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    patch:
      operationId: updateSettingsPatch
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /admin/referral-settings:
    get:
      operationId: listReferralSettings
      tags: [admin]
      responses:
        "200":
          description: Referral settings
          content:
