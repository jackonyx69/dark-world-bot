      responses:
        "200":
          description: Liked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  # ─── Users ────────────────────────────────────────────────────
  /users/register:
    post:
      operationId: registerUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationInput"
      responses:
        "200":
          description: User registered or updated
          content:
            application/json:
              schema:
